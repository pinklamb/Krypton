name: Krypton
description: Score how tangled a pull request's code is against its base, as one Krypton gate line in its checks, a scorecard in the run summary, and one pull request comment kept up to date.
author: Krypton

inputs:
  server:
    description: Use a different Krypton server than the default (optional).
    required: false
    default: ""
  fail-on-worse:
    description: Fail the check when the purity score went down ("true" or "false").
    default: "false"
  target:
    description: Fail the check when the files the pull request changed score below this purity (0-100). The rest of the codebase is never judged. Empty turns the rule off.
    required: false
    default: ""
  comment:
    description: 'Keep one Krypton comment on the pull request with the scorecard, edited on every push instead of adding another ("true" or "false"). Needs the pull-requests: write permission.'
    default: "true"
  site:
    description: The Krypton site address. When set, the gate line's Details opens your repository's tree there for this commit; otherwise it opens this run's summary.
    required: false
    default: ""
  on-server-error:
    description: 'What the gate shows when the Krypton server is down, busy or failing even after the client tried again, so the push was never scored: "fail" (red, marked "not your code") or "pass" (green, marked "not scored"), so an outage never slows a pull request down. Your code failing the gate is always red.'
    default: "fail"

# Needs a checkout with history first:  - uses: actions/checkout@v7 / with: { fetch-depth: 0 }
# and the permissions:  contents: read, statuses: write (the Krypton gate line), pull-requests: write (the one Krypton comment),
# id-token: write (logs in to Krypton as this repository; no secret to store).
runs:
  using: composite
  steps:
    - name: Build the Krypton client
      shell: bash
      run: |
        set -e
        cargo build --release --manifest-path "${{ github.action_path }}/client/Cargo.toml"
        echo "KRYPTON=${{ github.action_path }}/client/target/release/krypton" >> "$GITHUB_ENV"
        echo "KRYPTON_HOME=$RUNNER_TEMP/krypton-home" >> "$GITHUB_ENV"

    - name: Log in to Krypton as this repository
      id: login
      if: github.event_name == 'pull_request'
      shell: bash
      env:
        KRYPTON_SERVER: ${{ inputs.server }}
      run: |
        # a login that fails is recorded, not fatal: the next step turns it into a "not scored" gate line instead of a stalled check
        code=0
        "$KRYPTON" login --github-actions || code=$?
        echo "code=$code" >> "$GITHUB_OUTPUT"

    - name: Score the pull request against its base
      id: score
      if: github.event_name == 'pull_request'
      shell: bash
      env:
        KRYPTON_SERVER: ${{ inputs.server }}
        BASE: ${{ github.event.pull_request.base.sha }}
        FAIL_ON_WORSE: ${{ inputs.fail-on-worse }}
        TARGET: ${{ inputs.target }}
        HEAD: ${{ github.event.pull_request.head.sha }}
        LOGIN_CODE: ${{ steps.login.outputs.code }}
        ON_SERVER_ERROR: ${{ inputs.on-server-error }}
      run: |
        # Every Krypton call keeps its exit code (see the exit codes in the docs): 0 passed, 1 the code failed the gate, anything else means
        # the push could not be scored (the client has already tried again). This step never fails, so the gate line is always set.
        finish() {
          printf '\n<sub>Updated for %s.</sub>\n' "${HEAD:0:7}" >> "$RUNNER_TEMP/scorecard.md"
          cat "$RUNNER_TEMP/scorecard.md" >> "$GITHUB_STEP_SUMMARY"
          echo "state=$1" >> "$GITHUB_OUTPUT"
          echo "status=$2" >> "$GITHUB_OUTPUT"
          exit 0
        }
        unscored() {
          echo "::warning::Krypton could not score this push (exit $1); see the lines above for why."
          "$KRYPTON" comment --unscored "$1" --on-server-error "$ON_SERVER_ERROR" --line "$RUNNER_TEMP/line.txt" --state "$RUNNER_TEMP/state.txt" > "$RUNNER_TEMP/scorecard.md"
          finish "$(cat "$RUNNER_TEMP/state.txt")" "$1"
        }
        if [ "${LOGIN_CODE:-0}" != "0" ]; then unscored "$LOGIN_CODE"; fi
        git worktree add "$RUNNER_TEMP/krypton-base" "$BASE"
        code=0
        "$KRYPTON" scan "$RUNNER_TEMP/krypton-base" --summary "$RUNNER_TEMP/base.json" > /dev/null || code=$?
        if [ "$code" != "0" ]; then unscored "$code"; fi
        "$KRYPTON" scan . --summary "$RUNNER_TEMP/head.json" > /dev/null || code=$?
        if [ "$code" != "0" ]; then unscored "$code"; fi
        flag=""
        if [ "$FAIL_ON_WORSE" = "true" ]; then flag="--fail-if-worse"; fi
        rule=""
        if [ -n "$TARGET" ]; then
          rule="--target $TARGET"
          # only the files this pull request changed; a pull request that changed no source file has nothing to hold to the target
          "$KRYPTON" scan . --base "$BASE" --summary "$RUNNER_TEMP/changed.json" > /dev/null 2> "$RUNNER_TEMP/changed.err" || code=$?
          cat "$RUNNER_TEMP/changed.err" >&2
          if [ "$code" = "0" ]; then
            rule="$rule --changed $RUNNER_TEMP/changed.json"
          elif ! grep -q "nothing to score" "$RUNNER_TEMP/changed.err"; then
            unscored "$code"
          fi
        fi
        status=0
        "$KRYPTON" comment "$RUNNER_TEMP/base.json" "$RUNNER_TEMP/head.json" --line "$RUNNER_TEMP/line.txt" $flag $rule > "$RUNNER_TEMP/scorecard.md" || status=$?
        case "$status" in
          0) finish success 0 ;;
          1) finish failure 1 ;;
          *) unscored "$status" ;;
        esac

    - name: Post the comment and the gate line as the Krypton app
      id: report
      if: github.event_name == 'pull_request' && inputs.comment == 'true'
      shell: bash
      env:
        KRYPTON_SERVER: ${{ inputs.server }}
        HEAD: ${{ github.event.pull_request.head.sha }}
        PR: ${{ github.event.pull_request.number }}
        STATE: ${{ steps.score.outputs.state }}
        SITE: ${{ inputs.site }}
      run: |
        # Where the Krypton app is installed on this repository, the comment and the gate line come from it, with Krypton's name and crystal.
        # Anywhere else (exit 3), or if the server cannot be reached, the next two steps post them as github-actions; the gate is the same.
        site="${SITE%/}"
        if [ -n "$site" ]; then details="$site/tree?repo=$GITHUB_REPOSITORY&sha=$HEAD"; else details="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"; fi
        code=0
        "$KRYPTON" report --repo "$GITHUB_REPOSITORY" --pr "$PR" --sha "$HEAD" --state "$STATE" --line "$RUNNER_TEMP/line.txt" --scorecard "$RUNNER_TEMP/scorecard.md" --details "$details" || code=$?
        if [ "$code" = "0" ]; then
          echo "posted=true" >> "$GITHUB_OUTPUT"
        elif [ "$code" = "3" ]; then
          echo "The Krypton app is not installed on this repository; posting as github-actions instead."
          echo "posted=false" >> "$GITHUB_OUTPUT"
        else
          echo "::warning::Krypton could not post as its app (exit $code); posting as github-actions instead."
          echo "posted=false" >> "$GITHUB_OUTPUT"
        fi

    - name: Set the Krypton gate line
      if: github.event_name == 'pull_request' && steps.report.outputs.posted != 'true'
      uses: actions/github-script@v9
      env:
        STATE: ${{ steps.score.outputs.state }}
        SITE: ${{ inputs.site }}
      with:
        script: |
          const fs = require('fs');
          const line = fs.readFileSync(`${process.env.RUNNER_TEMP}/line.txt`, 'utf8').trim();
          const { owner, repo } = context.repo;
          const sha = context.payload.pull_request.head.sha;
          const site = (process.env.SITE || '').replace(/\/+$/, '');
          const details = site
            ? `${site}/tree?repo=${encodeURIComponent(`${owner}/${repo}`)}&sha=${sha}`
            : `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`;
          await github.rest.repos.createCommitStatus({
            owner,
            repo,
            sha,
            state: process.env.STATE,
            context: 'Krypton gate',
            description: line.slice(0, 140),
            target_url: details,
          });

    - name: Keep the Krypton comment on the pull request up to date (as github-actions)
      if: github.event_name == 'pull_request' && inputs.comment == 'true' && steps.report.outputs.posted != 'true'
      uses: actions/github-script@v9
      with:
        script: |
          // One comment per pull request: find ours by the hidden marker on its first line and edit it; create it only the first time.
          const fs = require('fs');
          const marker = '<!-- krypton-gate -->';
          const body = fs.readFileSync(`${process.env.RUNNER_TEMP}/scorecard.md`, 'utf8');
          const { owner, repo } = context.repo;
          const issue_number = context.payload.pull_request.number;
          try {
            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number, per_page: 100 });
            const ours = comments.find((c) => c.body && c.body.startsWith(marker));
            if (ours) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: ours.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }
          } catch (error) {
            // The gate line and the run summary are already set; a comment the token may not write (no pull-requests: write, or a fork) never fails the check.
            core.warning(`Krypton could not write its pull request comment (${error.status || ''} ${error.message}). Add "pull-requests: write" to the workflow's permissions to get it.`);
          }

    - name: Fail when the gate fails
      if: github.event_name == 'pull_request' && steps.score.outputs.state != 'success'
      shell: bash
      env:
        STATE: ${{ steps.score.outputs.state }}
      run: |
        if [ "$STATE" = "error" ]; then
          echo "Krypton could not score this push: $(cat "$RUNNER_TEMP/line.txt")"
        else
          echo "Krypton gate failed: $(cat "$RUNNER_TEMP/line.txt")"
        fi
        exit 1
