# Releases Krypton when you push a version tag (git tag v3.1.0 && git push origin v3.1.0):
#   1. checks the tag matches the client's version in client/Cargo.toml, so a release can never say one number and be another;
#   2. moves the v3 tag to this release, so workflows that use pinklamb/Krypton@v3 get it, and creates the GitHub release, which is what the
#      CLI's once-a-day update check reads. People update with `krypton update`: git pull in their clone, then a rebuild of the image.
name: Release

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]

permissions:
  contents: write   # create the release and move the major tag

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Check the tag matches the client's version
        id: version
        shell: bash
        run: |
          set -e
          tag="${GITHUB_REF_NAME#v}"
          crate="$(sed -n 's/^version = "\(.*\)"/\1/p' client/Cargo.toml | head -1)"
          if [ "$tag" != "$crate" ]; then
            echo "The tag says $tag but client/Cargo.toml says $crate; set the version there first." >&2
            exit 1
          fi
          echo "version=$tag" >> "$GITHUB_OUTPUT"
          echo "major=${tag%%.*}" >> "$GITHUB_OUTPUT"

      - name: Move the major tag to this release
        shell: bash
        env:
          MAJOR: ${{ steps.version.outputs.major }}
        run: |
          git tag -f "v$MAJOR" "$GITHUB_SHA"
          git push -f origin "v$MAJOR"

      - name: Create the GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "$GITHUB_REF_NAME" --title "Krypton $GITHUB_REF_NAME" --generate-notes
