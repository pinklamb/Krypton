# Publishes the Krypton documentation site (krypton/site/) to GitHub Pages on every push to main.
# One-time setup: repo Settings > Pages > Build and deployment > Source: "GitHub Actions".
# GitHub only reads workflows from the repository root .github/workflows, so this lives here, not in krypton/.
name: Deploy site

on:
  push:
    branches: [main]
    paths: ["krypton/site/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: krypton/site
      - id: deployment
        uses: actions/deploy-pages@v4
