# Releases Krypton when you push a version tag (git tag v3.1.0 && git push origin v3.1.0):
#   1. checks the tag matches the client's version in client/Cargo.toml, so a release can never say one number and be another;
#   2. builds the client's Docker image and publishes it as ghcr.io/<owner>/krypton:3.1.0, :3 and :latest, which is what `krypton update`
#      pulls (no clone, no build on anyone's computer);
#   3. moves the v3 tag to this release, so workflows that use pinklamb/Krypton@v3 get it, and creates the GitHub release, which is what the
#      CLI's once-a-day update check reads.
# One-time setup after the first release: the package page (github.com/<owner>?tab=packages > krypton > Package settings) > Change
# visibility to Public, so `docker pull` works without logging in.
name: Release

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]

permissions:
  contents: write   # create the release and move the major tag
  packages: write   # publish the image to ghcr.io

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check the tag matches the client's version
        id: version
        shell: bash
        run: |
          set -e
          tag="${GITHUB_REF_NAME#v}"
          crate="$(sed -n 's/^version = "\(.*\)"/\1/p' client/Cargo.toml | head -1)"
          if [ "$tag" != "$crate" ]; then
            echo "The tag says $tag but client/Cargo.toml says $crate; set the version there first." >&2
            exit 1
          fi
          echo "version=$tag" >> "$GITHUB_OUTPUT"
          echo "major=${tag%%.*}" >> "$GITHUB_OUTPUT"
          echo "image=ghcr.io/$(echo "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')/krypton" >> "$GITHUB_OUTPUT"

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish the image
        shell: bash
        env:
          IMAGE: ${{ steps.version.outputs.image }}
          VERSION: ${{ steps.version.outputs.version }}
          MAJOR: ${{ steps.version.outputs.major }}
        run: |
          set -e
          docker build -t "$IMAGE:$VERSION" client
          for tag in "$VERSION" "$MAJOR" latest; do
            docker tag "$IMAGE:$VERSION" "$IMAGE:$tag"
            docker push "$IMAGE:$tag"
          done

      - name: Move the major tag to this release
        shell: bash
        env:
          MAJOR: ${{ steps.version.outputs.major }}
        run: |
          git tag -f "v$MAJOR" "$GITHUB_SHA"
          git push -f origin "v$MAJOR"

      - name: Create the GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "$GITHUB_REF_NAME" --title "Krypton $GITHUB_REF_NAME" --generate-notes
